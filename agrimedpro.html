function f_on(id){const f=S.f.find(x=>x.id==id);f.on=f.on?0:1;sv();R()}
function doRecv(){const p=S.p.find(x=>x.id==$("#rp").value),n=+$("#rq").value;if(!n||n<1)return toast(t("req"));p.q+=n;S.ops.unshift({k:"rcv",w:V("rs")||L(p.n),d:today()+" "+new Date().toTimeString().slice(0,5),c:"#2e9e5b"});sv();toast(t("saved"));go("ops")}
function doSell(){const f=S.f.find(x=>x.id==ds.f),p=S.p.find(x=>x.id==ds.p),n=+$("#sq").value;if(!n||n<1)return toast(t("req"));if(n>p.q)return toast(t("avl")+": "+p.q);
p.q-=n;const no=String(Math.max(...S.inv.map(i=>+i.no))+1).padStart(6,"0");S.inv.unshift({no,f:f.id,d:today(),tot:n*p.sell,it:[L(p.n),n]});S.ops.unshift({k:"disp",w:f.n,d:today()+" "+new Date().toTimeString().slice(0,5),c:"#d9382b"});sv();toast(t("saved"));showI(no);R()}
function showI(no){const i=S.inv.find(x=>x.no==no);const r=(a,b)=>`<div class="row" style="justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--bd)"><span class="m">${a}</span><b>${b}</b></div>`;
modal(`<h2>🌿 AgriMed</h2><h3>${t("inv")} ${i.no}</h3>`+r(t("farmer"),fn(i.f))+r(t("date")||"",i.d)+(i.it?r(t("prod"),i.it[0]+" × "+i.it[1]):"")+r(t("tot"),N(i.tot)+" "+t("dzd"))+`<button style="width:100%;margin-top:14px" onclick="print()">${t("print")}</button>`)}
function doAI(){const x=$("#at").value.trim();if(!x)return;chat.push({u:1,x:esc(x)});const lx=x.toLowerCase();let a;
const c=Object.keys(CR).find(k=>D[k].some(n=>lx.includes(n.toLowerCase().slice(0,5))));const ps=S.p.filter(p=>p.n.some&&p.n.some(n=>lx.includes(n.toLowerCase().split(" ")[0])));
if(c)a=CR[c].map(r=>`${L(r[1])} ← ${t(r[0])}: `+(S.p.filter(p=>p.t==r[0]).map(p=>`${L(p.n)} (${p.q})`).join("، ")||"-")).join("<br>");
else if(ps.length)a=ps.map(p=>`${L(p.n)}: ${p.q} ${t("u_"+p.u)} · ${lc(p)} · ${N(p.sell)} ${t("dzd")}`).join("<br>");else a=t("aino");
chat.push({x:a});R()}
R();
</script>
